grumphp:
    process_timeout: 300
    stop_on_failure: false
    ignore_unstaged_changes: false
    hide_circumvention_tip: false
    parallel:
        enabled: true
        max_workers: 4
    tasks:
        phpstan:
            configuration: phpstan.neon
            level: 8
            use_grumphp_paths: false
        rector:
            config: rector.php
            triggered_by: ['php']
            # vendor/ est du code tiers/généré (dont les autoload_*.php versionnés) :
            # jamais retraité par Rector, sinon tout commit sur vendor/ est bloqué.
            ignore_patterns: ['/vendor/']
        deptrac:
            depfile: deptrac.php
