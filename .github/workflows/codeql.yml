name: CodeQL — Security analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Scan hebdomadaire le dimanche à 03:00 UTC
    - cron: '0 3 * * 0'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (PHP)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: php
          # queries: security-extended,security-and-quality # décommenter pour un scan plus profond
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:php"
