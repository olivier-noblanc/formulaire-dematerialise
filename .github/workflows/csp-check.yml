# csp-check.yml — Vérifie la conformité CSP via Playwright (E2E).
#
# Pour chaque page critique, le test :
#   1. Injecte un listener SecurityPolicyViolationEvent
#   2. Vérifie la présence et le format du header Content-Security-Policy
#   3. Détecte les violations CSP runtime côté navigateur
#   4. Compte les inline style= et <style> pour le suivi
#
# Le CSP autorise 'unsafe-inline' tant que le code utilise du inline.
# Ce workflow servira de filet de sécurité dès que 'unsafe-inline' sera retiré.

name: CSP Check

env:
  CI_CONFIG: |
    <?php
    define('DEFAULT_DB_PATH', __DIR__ . '/db/workflow.db');
    define('DB_PATH', DEFAULT_DB_PATH);
    define('BASE_URL', 'http://localhost');
    define('SETTINGS_DEFAULTS', [
        'smtp_host' => 'localhost', 'smtp_port' => '25',
        'smtp_from' => 'test@localhost', 'smtp_from_name' => 'CircuitDemat',
        'delai_relance_h' => '48', 'admin_email' => 'olivier.noblanc@test.local',
        'token_expire_days' => '30', 'relance_max' => '3',
        'app_name' => 'CircuitDémat — DREETS BFC', 'email_domain' => 'test.local',
        'base_url' => 'http://localhost',
    ]);

on:
  push:
    paths:
      - 'src/Security/**'
      - 'src/Render/**'
      - 'src/Controller/**'
      - 'src/Mail/**'
      - 'src/Token/**'
      - 'src/Workflow/**'
      - 'src/Auth/**'
      - 'index.php'
      - 'assets.php'
      - 'style.php'
      - 'tests/e2e/csp_check.spec.js'
      - '.github/workflows/csp-check.yml'
  pull_request:
    paths:
      - 'src/Security/**'
      - 'src/Render/**'
      - 'src/Controller/**'
      - 'src/Mail/**'
      - 'src/Token/**'
      - 'src/Workflow/**'
      - 'src/Auth/**'
      - 'index.php'
      - 'assets.php'
      - 'style.php'
      - 'tests/e2e/csp_check.spec.js'
      - '.github/workflows/csp-check.yml'

jobs:
  csp-check:
    name: CSP Compliance (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # continue-on-error conservé le temps de confirmer que la bascule
    # chromium→firefox (2026-07-30) fait tourner ce workflow correctement
    # (jamais eu de run vert jusqu'ici) — à retirer une fois confirmé.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create config.php + db dir
        run: |
          echo "$CI_CONFIG" > config.php
          mkdir -p db

      - name: Install Playwright + Firefox
        run: |
          npm install
          npx playwright install firefox
          npx playwright install-deps firefox

      - name: Run CSP check
        run: node tests/e2e/csp_check.spec.js
        env:
          APP_TEST_MODE: ''
          APP_TEST_SECRET: ''
