name: CI — Gate qualité

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff --no-progress 2>&1 || echo "php-cs-fixer skipped (not critical)"

  phpstan:
    name: PHPStan (level 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  phpunit:
    name: PHPUnit (unit + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Create DB directory
        run: mkdir -p db
      - run: vendor/bin/phpunit --no-coverage

  functional:
    name: Tests fonctionnels
    runs-on: ubuntu-latest
    needs: [phpstan, phpunit]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Create DB directory
        run: mkdir -p db
      - name: test_all.php
        run: php tests/test_all.php
      - name: test_mail_escaping.php
        run: php tests/test_mail_escaping.php
      - name: test_email_urls.php
        run: php tests/test_email_urls.php
      - name: test_assets_cache.php
        run: php tests/test_assets_cache.php
