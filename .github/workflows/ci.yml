name: CI — Gate qualité

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CONFIG: |
    <?php
    define('DEFAULT_DB_PATH', __DIR__ . '/db/workflow.db');
    define('DB_PATH', DEFAULT_DB_PATH);
    define('BASE_URL', 'http://localhost');
    define('SETTINGS_DEFAULTS', [
        'smtp_host' => 'localhost', 'smtp_port' => '25',
        'smtp_from' => 'test@localhost', 'smtp_from_name' => 'CircuitDemat',
        'delai_relance_h' => '48', 'admin_email' => 'admin@ci.test',
        'token_expire_days' => '30', 'relance_max' => '3',
        'app_name' => 'CircuitDémat — DREETS BFC', 'email_domain' => 'ci.test',
        'base_url' => 'http://localhost',
    ]);

jobs:
  # ── Lint ──────────────────────────────────────────────────────
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Lint all PHP files
        run: |
          failed=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null 2>&1 || { echo "SYNTAX ERROR: $f"; failed=1; }
          done < <(find src/ lib/ classes/ tests/ -name '*.php' 2>/dev/null; find . -maxdepth 1 -name '*.php')
          exit $failed

  # ── Analyse statique ─────────────────────────────────────────
  phpstan:
    name: PHPStan (level 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php
        run: echo "$CI_CONFIG" > config.php
      - run: php vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  # ── PHPStan sur tests/ ──────────────────────────────────────────
  # tests/phpstan.neon existe depuis longtemps (niveau 7, scope tests/) mais
  # n'était câblé dans aucune CI. C'est directement ce qui a laissé passer
  # 47 scripts orphelins appelant des fonctions procédurales supprimées
  # (session du 2026-07-29) — PHPStan aurait détecté "Function xxx not
  # found" immédiatement si ce job avait tourné. Pas de baseline existante :
  # continue-on-error tant que le volume réel d'erreurs pré-existantes n'a
  # pas été mesuré et baseliné (voir TODO.md) — à retirer une fois fait.
  phpstan-tests:
    name: PHPStan (tests/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php
        run: echo "$CI_CONFIG" > config.php
      - run: php vendor/bin/phpstan analyse -c tests/phpstan.neon --memory-limit=512M --no-progress

  # ── PHPStan : détection style=/onXxx=/<script> inline ──────────
  # Règle custom (phpstan-rules/NoInlineHtmlRule.php), config et job
  # séparés du job "phpstan" principal (src/, level 8, déjà vert avec sa
  # baseline curée) — volume réel de violations inconnu tant que ça n'a
  # pas tourné une fois en CI (même précaution que phpstan-tests
  # ci-dessus). Pas de config.php nécessaire : la règle n'exécute aucun
  # code applicatif, juste de l'analyse AST des littéraux de chaîne.
  phpstan-no-inline:
    name: PHPStan (no inline HTML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - run: php vendor/bin/phpstan analyse -c phpstan-no-inline.neon --memory-limit=512M --no-progress

  # ── PHPStan : décalages placeholders '?' / arguments execute() ──
  # Règle custom (phpstan-rules/SqlPlaceholderCountRule.php) — détecte les
  # échecs SQL silencieux type TokenService::regenerate() (session
  # 2026-07-30) : un execute([...]) avec moins d'éléments que de '?' dans
  # la requête préparée n'échoue pas en PDO/SQLite, il matche NULL au lieu
  # de planter. continue-on-error pour ce premier run — volume réel
  # inconnu tant que ça n'a pas tourné une fois en CI (même précaution que
  # phpstan-no-inline ci-dessus).
  phpstan-sql-placeholder:
    name: PHPStan (SQL placeholder mismatch)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - run: php vendor/bin/phpstan analyse -c phpstan-sql-placeholder.neon --memory-limit=512M --no-progress

  # ── PHPStan : catch qui avale une exception silencieusement ─────
  # Règle custom (phpstan-rules/NoSilentCatchRule.php) — opérationnalise
  # AGENTS.md règle 9 ("Ne jamais avaler une exception sur un chemin
  # critique"). Tous les patterns NoSilentCatchRule + strict-rules résiduels
  # sont baselinés dans phpstan-no-silent-catch.neon (47 patterns). Job
  # bloquant depuis le 2026-08-01 (zéro continue-on-error, zéro tolérance).
  phpstan-no-silent-catch:
    name: PHPStan (no silent catch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - run: php vendor/bin/phpstan analyse -c phpstan-no-silent-catch.neon --memory-limit=512M --no-progress

  # ── Tests unitaires + e2e + couverture ─────────────────────────
  phpunit:
    name: PHPUnit (unit + e2e + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: xdebug # active Xdebug pour générer le coverage
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php + db dir
        run: |
          echo "$CI_CONFIG" > config.php
          mkdir -p db
      - name: Run PHPUnit with coverage
        run: php vendor/bin/phpunit --coverage-clover coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false # non-blocking — l'upload codecov dépend d'un service externe
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: coverage.xml
          retention-days: 7

  # ── Mutation testing (Infection) ──────────────────────────────
  infection:
    name: Infection (mutation testing)
    runs-on: ubuntu-latest
    needs: phpunit # réutilise le vendor mis en cache

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: pcov # pcov est plus rapide que xdebug pour infection
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php + db dir
        run: |
          echo "$CI_CONFIG" > config.php
          mkdir -p db
      - name: Run Infection
        run: php vendor/bin/infection --threads=4 --no-progress --min-msi=30 --min-covered-msi=50
      - name: Upload infection log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infection-log
          path: infection.log
          retention-days: 7

  # ── Style de code ────────────────────────────────────────────
  cs-fixer:
    name: PHP CS Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Check code style (dry-run)
        # Job bloquant depuis le 2026-08-01.
        # 30/33 fichiers corrigés (constructeurs vides, use statements, quotes, espaces).
        # Reste : AdminFormsRenderer (295 lignes CSS heredoc) + NavigationRenderer
        # (86 lignes JS heredoc) — réindentation heredoc trop risquée sans PHP local.
        # TODO : appliquer php-cs-fixer fix sur ces 2 fichiers quand PHP disponible.
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none --using-cache=no

  # ── Modernisation PHP ────────────────────────────────────────
  rector:
    name: Rector (modernisation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php
        run: echo "$CI_CONFIG" > config.php
      - name: Check with Rector (dry-run)
        # Job bloquant depuis le 2026-08-01.
        # La règle ReplaceMagicStringWithEnumRector a été corrigée pour ne
        # remplacer que dans les contextes de comparaison/assignment (pas
        # les clés d'array, args de fonction, ou SQL). 0 faux positifs attendus.
        run: php vendor/bin/rector process --dry-run --no-progress-bar

  # ── Sécurité deps ────────────────────────────────────────────
  security:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Audit dependencies for vulnerabilities
        run: composer audit --no-dev

  # ── Architecture : Deptrac + dead-code detector ───────────────
  architecture:
    name: Deptrac + Dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php
        run: echo "$CI_CONFIG" > config.php
      - name: Deptrac (architecture layers)
        # Job bloquant depuis le 2026-08-01 — les violations doivent être à 0.
        run: php vendor/bin/deptrac analyse --no-progress
      # Le dead-code detector (shipmonk) est intégré à PHPStan via son extension.
      # Il est déjà couvert par le job phpstan ci-dessus.

  # ── Copy/Paste Detector (phpcpd) ─────────────────────────────
  phpcpd:
    name: PHP Copy/Paste Detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Download phpcpd phar
        run: |
          curl -sSLo phpcpd.phar https://phar.phpunit.de/phpcpd.phar
          chmod +x phpcpd.phar
      - name: Run phpcpd on src/
        # Job bloquant depuis le 2026-08-01 — les doublons doivent être sous le seuil.
        run: php phpcpd.phar src/ --min-lines=10 --min-tokens=50

  # ── Tests fonctionnels ───────────────────────────────────────
  functional:
    name: Tests fonctionnels
    runs-on: ubuntu-latest
    needs: [phpstan, phpunit]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php + db dir
        run: |
          echo "$CI_CONFIG" > config.php
          mkdir -p db
      - name: test_all.php
        run: php tests/test_all.php
      - name: test_mail_escaping.php
        run: php tests/test_mail_escaping.php
      - name: test_email_urls.php
        run: php tests/test_email_urls.php
      - name: test_assets_cache.php
        run: php tests/test_assets_cache.php
      - name: test_confirm_action_dispatch.php
        run: php tests/test_confirm_action_dispatch.php
      - name: tests/regression/run_all.php
        run: php tests/regression/run_all.php

  # ── Tests E2E Playwright (Firefox) ───────────────────────────
  playwright:
    name: E2E Playwright (Firefox)
    runs-on: ubuntu-latest
    needs: [phpstan]
    # Job bloquant. La bascule chromium→firefox (2026-07-30) a résolu le bug
    # de chemin chromium_headless_shell. Le seeding admin a été aligné le
    # 2026-08-01 (email_domain='exemple.invalid' → AUTH_USER dérive en
    # 'admin.local@exemple.invalid' qui matche l'admin en DB).

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php + db dir
        run: |
          echo "$CI_CONFIG" > config.php
          mkdir -p db
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright + Firefox
        run: |
          if [ -f package.json ]; then npm install; fi
          npx playwright install firefox
          npx playwright install-deps firefox
      - name: Run Playwright tests
        # Bascule chromium → firefox le 2026-07-30 : évite le bug de chemin
        # chromium_headless_shell (binaire installé dans ms-playwright/
        # chromium-XXXX, cherché dans ms-playwright/chromium_headless_shell-XXXX)
        # qui forçait continue-on-error + `|| true` jusqu'ici.
        run: node tests/e2e/run_all.js
