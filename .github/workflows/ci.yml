name: CI — Gate qualité

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CONFIG: |
    <?php
    define('DEFAULT_DB_PATH', __DIR__ . '/db/workflow.db');
    define('DB_PATH', DEFAULT_DB_PATH);
    define('BASE_URL', 'http://localhost');
    define('SETTINGS_DEFAULTS', [
        'smtp_host' => 'localhost', 'smtp_port' => '25',
        'smtp_from' => 'test@localhost', 'smtp_from_name' => 'CircuitDemat',
        'delai_relance_h' => '48', 'admin_email' => 'admin@test.local',
        'token_expire_days' => '30', 'relance_max' => '3',
        'app_name' => 'CircuitDémat — DREETS BFC', 'email_domain' => 'test.local',
        'base_url' => 'http://localhost',
    ]);

jobs:
  # ── Lint ──────────────────────────────────────────────────────
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Lint all PHP files
        run: |
          failed=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null 2>&1 || { echo "SYNTAX ERROR: $f"; failed=1; }
          done < <(find src/ lib/ -name '*.php')
          exit $failed

  # ── Analyse statique ─────────────────────────────────────────
  phpstan:
    name: PHPStan (level 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist
      - name: Create config.php
        run: echo "$CI_CONFIG" > config.php
      - run: php vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  # ── Tests unitaires + e2e ────────────────────────────────────
  phpunit:
    name: PHPUnit (unit + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist
      - name: Create config.php + db dir
        run: |
          echo "$CI_CONFIG" > config.php
          mkdir -p db
      - name: Run PHPUnit
        run: php vendor/bin/phpunit --no-coverage

  # ── Style de code ────────────────────────────────────────────
  cs-fixer:
    name: PHP CS Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist
      - name: Check code style (dry-run)
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff --no-progress --using-cache=no 2>&1 || true

  # ── Modernisation PHP ────────────────────────────────────────
  rector:
    name: Rector (modernisation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist
      - name: Create config.php
        run: echo "$CI_CONFIG" > config.php
      - name: Check with Rector (dry-run)
        run: php vendor/bin/rector process --dry-run --no-progress-bar 2>&1 || true

  # ── Sécurité deps ────────────────────────────────────────────
  security:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist
      - name: Audit dependencies for vulnerabilities
        run: composer audit --no-dev 2>&1 || echo "::warning::Composer audit found issues (non-blocking)"

  # ── Tests fonctionnels ───────────────────────────────────────
  functional:
    name: Tests fonctionnels
    runs-on: ubuntu-latest
    needs: [phpstan, phpunit]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist
      - name: Create config.php + db dir
        run: |
          echo "$CI_CONFIG" > config.php
          mkdir -p db
      - name: test_all.php
        run: php tests/test_all.php
      - name: test_mail_escaping.php
        run: php tests/test_mail_escaping.php
      - name: test_email_urls.php
        run: php tests/test_email_urls.php
      - name: test_assets_cache.php
        run: php tests/test_assets_cache.php
