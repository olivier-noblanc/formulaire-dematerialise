name: CI — Gate qualité

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # permet de déclencher manuellement depuis l'UI GitHub

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CONFIG: |
    <?php
    define('DEFAULT_DB_PATH', __DIR__ . '/db/workflow.db');
    define('DB_PATH', DEFAULT_DB_PATH);
    define('BASE_URL', 'http://localhost');
    define('SETTINGS_DEFAULTS', [
        'smtp_host' => 'localhost', 'smtp_port' => '25',
        'smtp_from' => 'test@localhost', 'smtp_from_name' => 'CircuitDemat',
        'delai_relance_h' => '48', 'admin_email' => 'admin@test.local',
        'token_expire_days' => '30', 'relance_max' => '3',
        'app_name' => 'CircuitDémat — DREETS BFC', 'email_domain' => 'test.local',
        'base_url' => 'http://localhost',
    ]);

jobs:
  # ── Lint ──────────────────────────────────────────────────────
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Lint all PHP files
        run: |
          failed=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null 2>&1 || { echo "SYNTAX ERROR: $f"; failed=1; }
          done < <(find src/ lib/ classes/ tests/ -name '*.php' 2>/dev/null; find . -maxdepth 1 -name '*.php')
          exit $failed

  # ── Analyse statique ─────────────────────────────────────────
  phpstan:
    name: PHPStan (level 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php
        run: echo "$CI_CONFIG" > config.php
      - run: php vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  # ── Tests unitaires + e2e + couverture ─────────────────────────
  phpunit:
    name: PHPUnit (unit + e2e + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: xdebug # active Xdebug pour générer le coverage
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php + db dir
        run: |
          echo "$CI_CONFIG" > config.php
          mkdir -p db
      - name: Run PHPUnit with coverage
        run: php vendor/bin/phpunit --coverage-clover coverage.xml --coverage-text=/dev/stdout
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false # non-blocking — la couverture est informative
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: coverage.xml
          retention-days: 7

  # ── Mutation testing (Infection) ──────────────────────────────
  infection:
    name: Infection (mutation testing)
    runs-on: ubuntu-latest
    needs: phpunit # réutilise le vendor mis en cache
    continue-on-error: true # non-blocking pour l'instant — on observe les métriques avant de bloquer
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: pcov # pcov est plus rapide que xdebug pour infection
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php + db dir
        run: |
          echo "$CI_CONFIG" > config.php
          mkdir -p db
      - name: Run Infection
        run: php vendor/bin/infection --threads=4 --no-progress --min-msi=30 --min-covered-msi=50
      - name: Upload infection log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infection-log
          path: infection.log
          retention-days: 7

  # ── Style de code ────────────────────────────────────────────
  cs-fixer:
    name: PHP CS Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Check code style (dry-run)
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff --no-progress --using-cache=no 2>&1 || true

  # ── Modernisation PHP ────────────────────────────────────────
  rector:
    name: Rector (modernisation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php
        run: echo "$CI_CONFIG" > config.php
      - name: Check with Rector (dry-run)
        run: php vendor/bin/rector process --dry-run --no-progress-bar 2>&1 || true

  # ── Sécurité deps ────────────────────────────────────────────
  security:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Audit dependencies for vulnerabilities
        run: composer audit --no-dev 2>&1 || echo "::warning::Composer audit found issues (non-blocking)"

  # ── Architecture : Deptrac + dead-code detector ───────────────
  architecture:
    name: Deptrac + Dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php
        run: echo "$CI_CONFIG" > config.php
      - name: Deptrac (architecture layers)
        # Non-blocking : affiche les violations sans faire échouer la CI.
        # Quand les violations seront à 0, on retirera le `|| true`.
        run: php vendor/bin/deptrac analyse --no-progress || true
      # Le dead-code detector (shipmonk) est intégré à PHPStan via son extension.
      # Il est déjà couvert par le job phpstan ci-dessus.

  # ── Copy/Paste Detector (phpcpd) ─────────────────────────────
  phpcpd:
    name: PHP Copy/Paste Detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Download phpcpd phar
        run: |
          curl -sSLo phpcpd.phar https://phar.phpunit.de/phpcpd.phar
          chmod +x phpcpd.phar
      - name: Run phpcpd on src/
        # Non-blocking : on affiche les doublons détectés sans faire échouer la CI.
        # Quand le seuil sera acceptable, on pourra retirer le `|| true`.
        run: php phpcpd.phar src/ --min-lines=10 --min-tokens=50 --no-progress || true

  # ── Tests fonctionnels ───────────────────────────────────────
  functional:
    name: Tests fonctionnels
    runs-on: ubuntu-latest
    needs: [phpstan, phpunit]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php + db dir
        run: |
          echo "$CI_CONFIG" > config.php
          mkdir -p db
      - name: test_all.php
        run: php tests/test_all.php
      - name: test_mail_escaping.php
        run: php tests/test_mail_escaping.php
      - name: test_email_urls.php
        run: php tests/test_email_urls.php
      - name: test_assets_cache.php
        run: php tests/test_assets_cache.php
      - name: tests/regression/run_all.php
        run: php tests/regression/run_all.php

  # ── Tests E2E Playwright (Firefox) ───────────────────────────
  playwright:
    name: E2E Playwright (Firefox)
    runs-on: ubuntu-latest
    needs: [phpstan]
    continue-on-error: true # non-blocking tant que la suite est stabilisée
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Create config.php + db dir
        run: |
          echo "$CI_CONFIG" > config.php
          mkdir -p db
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Firefox
        run: |
          if [ -f package.json ]; then npm install; fi
          npx playwright install firefox
          npx playwright install-deps firefox
      - name: Run Playwright tests
        env:
          # Le serveur PHP est démarré par le script de test lui-même via start_server.php
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npx playwright test --project=firefox --reporter=list 2>&1 || true
